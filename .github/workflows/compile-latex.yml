name: Compilar Documento LaTeX

on:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Aquí le indicamos la ruta exacta a las carpetas docs/paper/
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: docs/paper/main.tex

      # El PDF se genera en la misma carpeta del .tex, así que lo buscamos ahí
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Documento-PDF
          path: docs/paper/main.pdf
